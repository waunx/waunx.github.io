<section
  class="training-card"
  data-strava-heatmap
  data-source="https://raw.githubusercontent.com/{{ site.repository }}/strava-data/strava-heatmap.json"
  data-fallback="{{ '/assets/data/strava-heatmap.json' | relative_url }}"
  aria-labelledby="training-card-title"
>
  <div class="training-card__header">
    <div>
      <span class="training-card__eyebrow">Training log</span>
      <h3 id="training-card-title">A year in motion</h3>
    </div>
    <a href="https://www.strava.com/athletes/wan_kris" target="_blank" rel="noopener noreferrer">View on Strava</a>
  </div>

  <div class="training-card__stats" aria-live="polite">
    <span><strong data-stat="active-days">—</strong> active days</span>
    <span><strong data-stat="activities">—</strong> activities</span>
    <span><strong data-stat="running">—</strong> running sessions</span>
    <span><strong data-stat="strength">—</strong> strength sessions</span>
    <span><strong data-stat="hours">—</strong> hours</span>
    <span><strong data-stat="distance">—</strong> km</span>
  </div>

  <div class="training-card__scroll" data-heatmap-scroll tabindex="0" aria-label="Scrollable activity heatmap">
    <div class="training-heatmap" data-heatmap-grid aria-label="Daily training activity over the last 53 weeks"></div>
  </div>

  <div class="training-card__footer">
    <span data-heatmap-status>Waiting for the first private Strava sync.</span>
    <span class="training-card__legend" aria-label="Relative training load legend">
      Less
      <i data-level="0"></i><i data-level="1"></i><i data-level="2"></i><i data-level="3"></i><i data-level="4"></i>
      More
    </span>
  </div>
</section>
